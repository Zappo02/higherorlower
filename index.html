*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,#root{height:100%;margin:0}

.app{
  --radius:18px;
  height:100%;min-height:100%;overflow:hidden;
  color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  display:flex;flex-direction:column;position:relative;
  transition:background .35s ease,color .35s ease;
}

/* ---------- TEMA SCURO ---------- */
.app.dark{
  --text:#ffffff;
  --muted:#97a1bd;
  --faint:#616c8f;
  --panel:rgba(255,255,255,.05);
  --panel-2:rgba(255,255,255,.085);
  --line:rgba(255,255,255,.11);
  --vs-bg:#0b0e18;
  --ok:#2fd98a;
  --ko:#ff5470;
  --gold:#ffb01f;
  --glow:.42;
  --shadow:0 10px 34px rgba(0,0,0,.55);
  background:
    radial-gradient(90% 60% at 10% 0%, #16203a 0%, rgba(7,9,16,0) 60%),
    radial-gradient(90% 60% at 90% 100%, #241428 0%, rgba(7,9,16,0) 60%),
    #070910;
}

/* ---------- TEMA CHIARO ---------- */
.app.light{
  --text:#111522;
  --muted:#5d6681;
  --faint:#8a93ab;
  --panel:#ffffff;
  --panel-2:#f1f3fa;
  --line:rgba(17,21,34,.1);
  --vs-bg:#ffffff;
  --ok:#0f9d58;
  --ko:#e0344f;
  --gold:#b8780a;
  --glow:.2;
  --shadow:0 8px 26px rgba(17,21,34,.1);
  background:
    radial-gradient(90% 60% at 10% 0%, #e3ecff 0%, rgba(244,246,251,0) 62%),
    radial-gradient(90% 60% at 90% 100%, #ffe8ee 0%, rgba(244,246,251,0) 62%),
    #f4f6fb;
}

/* ---------- TOGGLE TEMA ---------- */
.theme-btn{
  position:absolute;top:12px;right:12px;z-index:20;
  width:38px;height:38px;border-radius:12px;cursor:pointer;
  border:1px solid var(--line);background:var(--panel);color:var(--text);
  font-size:17px;line-height:1;display:grid;place-items:center;
  box-shadow:var(--shadow);transition:transform .14s ease;
}
.theme-btn:active{transform:scale(.92)}

/* ---------- HOME ---------- */
.home{flex:1;display:flex;flex-direction:column;justify-content:center;padding:26px 20px;overflow-y:auto}
.brand{font-size:10px;letter-spacing:.3em;color:var(--faint);font-weight:800}
.title{font-size:clamp(32px,9.5vw,50px);line-height:1;margin:8px 0 0;font-weight:800;letter-spacing:-.035em}
.amp{background:linear-gradient(90deg,var(--ko),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;font-style:italic}
.tagline{color:var(--muted);font-size:13.5px;margin:10px 0 20px;line-height:1.45}

.sect{font-size:10px;letter-spacing:.2em;color:var(--faint);font-weight:800;margin:18px 0 9px}

.daily-card{
  width:100%;text-align:left;cursor:pointer;color:var(--text);
  border:1px solid var(--line);border-radius:var(--radius);padding:16px;
  background:
    linear-gradient(135deg,rgba(255,176,31,.14),rgba(255,84,112,.1)),
    var(--panel);
  box-shadow:var(--shadow);transition:transform .15s ease;
  display:flex;align-items:center;gap:14px;
}
.daily-card:active{transform:scale(.985)}
.daily-ico{font-size:24px;width:46px;height:46px;flex:0 0 auto;border-radius:14px;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line)}
.daily-body{flex:1;min-width:0}
.daily-h{font-weight:800;font-size:16px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pill{font-size:9.5px;font-weight:800;letter-spacing:.1em;padding:3px 7px;border-radius:999px;background:var(--gold);color:#1b1206}
.daily-s{font-size:12px;color:var(--muted);margin-top:3px}
.daily-go{font-size:24px;color:var(--faint);line-height:1}

.modes{display:flex;flex-direction:column;gap:10px}
.mode-card{
  display:flex;align-items:center;gap:13px;width:100%;
  padding:14px;border-radius:var(--radius);border:1px solid var(--line);
  background:var(--panel);color:var(--text);cursor:pointer;text-align:left;
  box-shadow:var(--shadow);transition:transform .15s ease;
}
.mode-card:active{transform:scale(.985)}
.mode-icon{font-size:22px;width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:var(--panel-2);border:1px solid var(--line);flex:0 0 auto}
.mode-text{flex:1;min-width:0}
.mode-label{font-weight:700;font-size:15.5px}
.mode-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.mode-rec{font-size:11.5px;color:var(--gold);font-weight:800}
.mode-go{font-size:24px;color:var(--faint);line-height:1}
.allgames{
  display:block;margin:18px auto 0;max-width:460px;width:100%;
  padding:12px 16px;border-radius:14px;text-align:center;text-decoration:none;
  border:1px solid var(--line);background:var(--panel);color:var(--text);
  font-size:13.5px;font-weight:700;box-shadow:var(--shadow);
  transition:transform .12s ease;
}
.allgames:active{transform:scale(.985)}
.foot{margin-top:22px;text-align:center;font-size:10.5px;color:var(--faint);letter-spacing:.05em;line-height:1.6}

/* ---------- HUD ---------- */
.game{flex:1;display:flex;flex-direction:column;min-height:0}
.hud{display:flex;align-items:center;gap:9px;padding:9px 56px 9px 10px;flex:0 0 auto}
.hud-back{background:none;border:0;color:var(--muted);font-size:28px;line-height:1;cursor:pointer;padding:0 6px}
.hud-mode{font-size:11.5px;color:var(--muted);font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-score{display:flex;align-items:center;gap:9px}
.hud-streak{font-size:20px;font-weight:800;line-height:1}
.hud-rec{font-size:10.5px;color:var(--gold);font-weight:800}

.dots{display:flex;gap:4px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dot.ok{background:var(--ok)}
.dot.ko{background:var(--ko)}
.dot.now{box-shadow:0 0 0 2px var(--panel-2);background:var(--muted)}

/* ---------- BOARD ---------- */
.board{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.card{flex:1;position:relative;overflow:hidden;min-height:0;display:flex}
.card-bg{position:absolute;inset:0}
.card-inner{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 16px;min-height:0}
.pl-top{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.pl-flag{font-size:18px}
.pl-role{font-size:9.5px;font-weight:800;letter-spacing:.09em;border:1px solid;border-radius:999px;padding:2px 7px}
.pl-name{font-size:clamp(18px,5.2vw,29px);font-weight:800;margin:0;text-align:center;line-height:1.12;letter-spacing:-.022em}
.pl-club{font-size:11.5px;color:var(--muted);margin-top:4px;text-align:center}
.pl-slot{margin-top:9px;display:flex;flex-direction:column;align-items:center;min-height:0}

.val{display:flex;flex-direction:column;align-items:center}
.val-num{font-size:clamp(32px,10.5vw,52px);font-weight:900;line-height:1;letter-spacing:-.045em}
.val-unit{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:4px;font-weight:800}
.val.reveal.ok .val-num{color:var(--ok)}
.val.reveal.ko .val-num{color:var(--ko)}
.verdict{margin-top:9px;font-size:11.5px;font-weight:800;letter-spacing:.13em}
.val.reveal.ok .verdict{color:var(--ok)}
.val.reveal.ko .verdict{color:var(--ko)}

.ask{display:flex;flex-direction:column;align-items:center;gap:7px}
.ask-q{font-size:11.5px;color:var(--muted);letter-spacing:.07em}
.ask-ref{font-size:10.5px;color:var(--faint);margin-top:1px;text-align:center;max-width:260px}
.btn{
  min-width:206px;padding:12px 20px;border-radius:14px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--text);font-size:13.5px;font-weight:800;letter-spacing:.05em;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .12s ease;
}
.btn:active{transform:scale(.97)}
/* fallback per browser senza color-mix(): le regole non valide vengono scartate */
.btn.hi{background:rgba(47,217,138,.16);border-color:rgba(47,217,138,.45)}
.btn.lo{background:rgba(255,84,112,.16);border-color:rgba(255,84,112,.45)}
.app.light .btn.hi{background:rgba(15,157,88,.12);border-color:rgba(15,157,88,.4)}
.app.light .btn.lo{background:rgba(224,52,79,.1);border-color:rgba(224,52,79,.38)}
.btn.hi{background:color-mix(in srgb,var(--ok) 16%,var(--panel));border-color:color-mix(in srgb,var(--ok) 42%,transparent)}
.btn.lo{background:color-mix(in srgb,var(--ko) 16%,var(--panel));border-color:color-mix(in srgb,var(--ko) 42%,transparent)}
.btn .arr{font-size:10px;opacity:.85}
.btn:disabled{opacity:.42}

.divider{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;justify-content:center;pointer-events:none;z-index:3}
.vs{
  width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:var(--vs-bg);border:1px solid var(--line);
  font-size:12px;font-weight:900;letter-spacing:.03em;color:var(--muted);
  box-shadow:var(--shadow);
}

.enter{animation:slideUp .42s cubic-bezier(.22,1,.36,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.flash-ok{animation:flashOk .6s ease}
.flash-ko{animation:flashKo .6s ease}
@keyframes flashOk{0%,100%{box-shadow:inset 0 0 0 0 rgba(47,217,138,0)}30%{box-shadow:inset 0 0 90px 0 rgba(47,217,138,.26)}}
@keyframes flashKo{0%,100%{box-shadow:inset 0 0 0 0 rgba(255,84,112,0)}30%{box-shadow:inset 0 0 90px 0 rgba(255,84,112,.26)}}

/* ---------- FINE PARTITA ---------- */
.over{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 20px;text-align:center;overflow-y:auto}
.over-icon{font-size:34px}
.over-label{margin-top:8px;font-size:11px;letter-spacing:.24em;color:var(--muted);font-weight:800}
.over-streak{font-size:clamp(64px,21vw,88px);font-weight:900;line-height:1;margin-top:4px;letter-spacing:-.05em}
.over-streak .den{font-size:.42em;color:var(--muted);letter-spacing:-.02em}
.over-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.over-badge{margin-top:15px;font-size:12.5px;font-weight:800;color:var(--gold);border:1px solid rgba(255,176,31,.38);background:rgba(255,176,31,.12);padding:7px 15px;border-radius:999px}
.over-badge{border-color:color-mix(in srgb,var(--gold) 38%,transparent);background:color-mix(in srgb,var(--gold) 12%,transparent)}
.over-badge.muted{color:var(--muted);border-color:var(--line);background:var(--panel);font-weight:600}
.grid{display:flex;gap:5px;margin-top:16px;flex-wrap:wrap;justify-content:center;max-width:280px}
.sq{width:21px;height:21px;border-radius:5px;background:var(--ko)}
.sq.ok{background:var(--ok)}
.recap{margin-top:16px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:5px;text-align:left}
.rc{display:flex;align-items:center;gap:8px;font-size:11.5px;padding:7px 10px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.rc-m{width:14px;flex:0 0 auto;font-weight:900}
.rc-m.ok{color:var(--ok)}
.rc-m.ko{color:var(--ko)}
.rc-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-v{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;font-weight:700}
.over-actions{margin-top:22px;display:flex;flex-direction:column;gap:9px;width:100%;max-width:330px}
.big{padding:14px;border-radius:14px;font-size:14.5px;font-weight:800;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);transition:transform .12s ease}
.big:active{transform:scale(.98)}
.big.primary{background:linear-gradient(135deg,var(--ko),var(--gold));border:0;color:#190b10}

/* ---------- DESKTOP ---------- */
@media (min-width:860px) and (min-aspect-ratio:1/1){
  .board{flex-direction:row}
  .divider{left:50%;top:0;bottom:0;right:auto;transform:translateX(-50%);align-items:center}
  .btn{min-width:238px}
  .home,.over{padding:30px 22px}
  .modes{max-width:460px}
